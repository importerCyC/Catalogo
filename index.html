<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPORTADORA C&C </title>
    <!-- Meta tags SEO -->
    <meta name="description"
        content="Página interactiva de Importadora C&C con frases inspiradoras para emprendedores.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Background overlay for smooth gradient overlay on the image -->
    <div class="bg-overlay"></div>

    <!-- Canvas for the wonderful particle explosion -->
    <canvas id="celebration-canvas"></canvas>

    <main class="container">
        <header class="header">
            <h1 class="main-title">IMPORTADORA C&C</h1>
            <div class="divider"></div>
        </header>

        <section class="card-wrapper">
            <div class="quote-card">
                <!-- Interactive medium logo button -->
                <button id="magic-btn" class="logo-btn" aria-label="Botón Mágico Importadora C&C">
                    <img src="logo.png" alt="Logo Importadora C&C" class="logo-img">
                </button>
            </div>
        </section>
    </main>

    <!-- Custom JS -->
    <script src="index.js"></script>
</body>

</html>
